<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Maak direct een QR-code voor iedere URL, met optioneel logo.">
    <title>QR Code Generator | jvgemert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body data-i18n-title="meta.title">
    <div class="bg-gradient"></div>

    <header>
        <div class="header-actions">
            <a href="../index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span data-i18n="header.back">Hub</span>
            </a>
            <a href="../donate/index.html" class="donate-link">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span data-i18n="nav.donate">Doneer</span>
            </a>
        </div>
        <h1 data-i18n="header.title">QR Code Generator</h1>
        <p data-i18n="header.subtitle">Maak in seconden een scanbare QR-code voor iedere URL, inclusief eigen logo.</p>
    </header>

    <main class="grid">
        <section class="card">
            <div class="badge" data-i18n="form.badge">Instellingen</div>
            <div class="card-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>

            <form id="qr-form" novalidate>
                <div class="field">
                    <label for="url-input" data-i18n="form.urlLabel">Website-URL</label>
                    <div class="input-row">
                        <input
                            id="url-input"
                            name="url"
                            type="text"
                            inputmode="url"
                            autocomplete="url"
                            placeholder="https://jouwwebsite.nl"
                            data-i18n-attr="placeholder:form.urlPlaceholder"
                            aria-describedby="url-error"
                            autofocus
                        >
                        <button type="submit">
                            <span data-i18n="form.generateButton">Genereer</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="correction-level" data-i18n="form.correctionLabel">Foutcorrectie</label>
                    <select id="correction-level" name="correction-level">
                        <option value="L" data-i18n="form.correction.l">Laag — herstelt tot 7%</option>
                        <option value="M" selected data-i18n="form.correction.m">Gemiddeld — herstelt tot 15%</option>
                        <option value="Q" data-i18n="form.correction.q">Hoog — herstelt tot 25%</option>
                        <option value="H" data-i18n="form.correction.h">Zeer hoog — herstelt tot 30%</option>
                    </select>
                </div>

                <div class="field">
                    <label for="logo-input"><span data-i18n="form.logoLabel">Logo in het midden</span> <span class="optional" data-i18n="form.optional">optioneel</span></label>
                    <div class="file-row">
                        <input id="logo-input" name="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
                        <button id="remove-logo-button" class="remove-logo" type="button" hidden data-i18n="form.removeLogo">Verwijderen</button>
                    </div>
                </div>

                <div class="field">
                    <label for="logo-size"><span data-i18n="form.logoSizeLabel">Grootte van logo</span> <output id="logo-size-value" for="logo-size">23%</output></label>
                    <input id="logo-size" name="logo-size" type="range" min="10" max="35" value="23" step="1" disabled>
                </div>

                <div class="field">
                    <label for="logo-margin"><span data-i18n="form.logoMarginLabel">Witte marge rond logo</span> <output id="logo-margin-value" for="logo-margin">16%</output></label>
                    <input id="logo-margin" name="logo-margin" type="range" min="0" max="30" value="16" step="1" disabled>
                </div>

                <p id="url-error" class="error" role="alert"></p>
            </form>
        </section>

        <section id="result" class="card card-result" hidden>
            <div class="badge" data-i18n="result.badge">Resultaat</div>
            <div id="qr-panel" class="qr-panel">
                <div id="qr-code" aria-label="Gegenereerde QR-code" data-i18n-attr="aria-label:result.qrAriaLabel"></div>
                <div id="logo-preview" class="logo-preview" hidden>
                    <img id="logo-image" alt="Gekozen logo" data-i18n-attr="alt:result.logoAlt">
                </div>
            </div>

            <div class="result-details">
                <h2 data-i18n="result.heading">Je QR-code is klaar</h2>
                <p id="result-url" class="result-url"></p>
            </div>

            <div class="field png-resolution-field">
                <label for="png-resolution" data-i18n="result.resolutionLabel">PNG-resolutie</label>
                <select id="png-resolution">
                    <option value="512">512 x 512 px</option>
                    <option value="1024" selected>1024 x 1024 px</option>
                    <option value="2048">2048 x 2048 px</option>
                    <option value="4096">4096 x 4096 px</option>
                </select>
            </div>

            <div class="actions">
                <button id="download-button" class="button-primary" type="button">
                    <span data-i18n="result.downloadPng">Download PNG</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button id="download-svg-button" class="button-secondary" type="button">
                    <span data-i18n="result.downloadSvg">Download SVG</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p data-i18n="footer.note">Je URL en logo verlaten je browser niet — alles wordt lokaal gegenereerd.</p>
    </footer>

    <script src="../i18n.js"></script>
    <script src="translations.js"></script>
    <script>
        window.APP_I18N = I18N.init(window.GENERATOR_DICT);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
